<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opportunity | Living Economy</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b28;color:#edf4ff;font:14px system-ui,Segoe UI,sans-serif;overflow:hidden}canvas{display:block}#hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;align-items:start}.panel{background:#102039e8;border:1px solid #52708b99;box-shadow:0 10px 30px #0006;border-radius:10px;padding:12px;pointer-events:auto;backdrop-filter:blur(8px)}.brand{font-size:18px;font-weight:800}.sub{color:#b4cce1;font-size:12px}.bottom{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;gap:10px}.buttons{display:flex;gap:6px;flex-wrap:wrap}button,select{background:#244767;color:white;border:1px solid #638eaf;border-radius:6px;padding:9px 12px;cursor:pointer;font:inherit}button:hover{background:#32638d}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#187ce2;border-color:#399cff}.status{font-size:12px;line-height:1.8}.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(470px,94vw);max-height:83vh;overflow:auto;display:none}.modal.show{display:block}h2{margin:0 0 8px;font-size:20px}p{line-height:1.5;color:#d4e3ef}.item{border:1px solid #49637c;padding:10px;margin:8px 0;border-radius:7px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.close{float:right}.tag{color:#92d4fa;font-size:12px}#toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:#0e2738ec;padding:10px 18px;border-radius:8px;display:none}.mini{width:160px;height:115px;background:#142c42;border:1px solid #6687a4;border-radius:8px;position:relative;overflow:hidden}.mini canvas{width:100%;height:100%}#hint{position:absolute;bottom:105px;left:50%;transform:translateX(-50%);background:#132b43e8;padding:8px 15px;border-radius:8px;text-align:center;min-width:200px}.key{background:#45617a;border-radius:4px;padding:2px 6px}.help{max-width:250px}@media(max-width:750px){.brand{font-size:14px}.help{display:none}.mini{width:105px;height:90px}.bottom{bottom:6px}.panel{padding:8px}.buttons button{padding:7px}#hint{bottom:130px}}
</style></head><body><div id="hud"><div class="top"><div class="panel"><div class="brand">✦ OPPORTUNITY <span class="tag">ALPHA 0.2</span></div><div id="zone" class="sub">Residential Area</div></div><div class="panel status" id="stats"></div></div><div id="toast"></div><div id="hint">WASD move · E interact · Drag to orbit</div><div class="bottom"><div class="panel"><div class="buttons"><button id="mapBtn">🗺 Travel</button><button id="careerBtn">🎓 Career</button><button id="profileBtn">👤 Profile</button><button id="saveBtn">💾 Save</button></div><div class="sub" style="margin-top:7px">WASD / arrows move · E interact · mouse drag orbit · scroll zoom</div></div><div class="panel mini"><canvas id="minimap" width="160" height="115"></canvas></div></div><div class="panel modal" id="modal"><button class="close" id="closeBtn">✕</button><div id="modalContent"></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {transact} from './src/economy.js';
import {initialQuest,transition} from './src/quests/broken-shoes.js';
const $=id=>document.getElementById(id);
const saved=(()=>{try{return JSON.parse(localStorage.getItem('opportunity-v2'))}catch{return null}})();
let state=Object.assign({zone:'residential',credits:1240,debt:24000,energy:82,skill:0,employed:false,applications:0,repairs:0,contributed:0,education:'Fine Arts',learned:false},saved||{});
const zones={residential:{name:'Residential Area',ground:0x83ad76,sky:0xb2d7f3,objects:[['Home',-22,0,'home'],['Bakery',-9,-17,'bakery'],['Repair Shop',16,-14,'repair'],['Clinic',23,10,'clinic'],['Neighborhood Store',-8,18,'store'],['Transport Terminal',0,27,'terminal']]},city:{name:'Big City',ground:0x84969c,sky:0xa5c8e9,objects:[['Town Hall',0,-24,'hall'],['Employment Center',-22,-5,'jobs'],['University',22,-8,'school'],['Business District',-19,19,'business'],['Bank',18,18,'bank'],['Transport Terminal',0,29,'terminal']]},rural:{name:'Rural Region',ground:0x9ab66e,sky:0xb5dff4,objects:[['Farm',-22,-14,'farm'],['Flour Mill',16,-19,'mill'],['Rural Market',-19,16,'market'],['Warehouse',19,13,'warehouse'],['Transport Terminal',0,29,'terminal']]}};
let scene,camera,renderer,player,clock=new THREE.Clock(),buildings=[],keys={},yaw=0.6,pitch=0.4,zoom=16,drag=false,lastX=0,lastY=0;
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.82});
const box=(w,h,d,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=true;m.receiveShadow=true;return m};
const label=(text)=>{const cv=document.createElement('canvas');cv.width=512;cv.height=96;const ctx=cv.getContext('2d');ctx.fillStyle='#10243bdd';ctx.roundRect(4,4,504,88,16);ctx.fill();ctx.fillStyle='white';ctx.font='bold 35px system-ui';ctx.textAlign='center';ctx.fillText(text,256,60);const t=new THREE.CanvasTexture(cv);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));sp.scale.set(8,1.5,1);return sp};
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0xb2d7f3);scene.fog=new THREE.Fog(0xb2d7f3,55,140);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.domElement.id='gameCanvas';renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x506342,2.3));const sun=new THREE.DirectionalLight(0xfff1cf,2.6);sun.position.set(25,55,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-75;sun.shadow.camera.right=75;sun.shadow.camera.top=75;sun.shadow.camera.bottom=-75;scene.add(sun);
player=new THREE.Group();const torso=box(1.05,1.55,.65,0x283e56);torso.position.y=1.55;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.44,16,12),mat(0xd8a27b));head.position.y=2.65;player.add(head);const hair=box(.87,.25,.82,0x32251e);hair.position.y=2.99;player.add(hair);for(const s of [-1,1]){const leg=box(.36,1,.4,0x293047);leg.position.set(s*.26,.5,0);player.add(leg);const arm=box(.3,1.3,.35,0xd0a180);arm.position.set(s*.72,1.55,0);player.add(arm)}const bag=box(.85,1,.35,0x76513c);bag.position.set(0,1.55,.53);player.add(bag);scene.add(player);buildZone();animate()}
function tree(x,z){const trunk=box(.5,2.7,.5,0x76583d);trunk.position.set(x,1.35,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(2.1,9,7),mat(0x398354));crown.position.set(x,4,z);crown.castShadow=true;scene.add(crown)}
function building(name,x,z,type,i){const g=new THREE.Group();g.position.set(x,0,z);const tall=type==='business'?15:type==='hall'?8:type==='school'?9:type==='mill'?8:4.5+((i%3)*1.4);const width=type==='hall'?13:type==='business'?9:8;const colors={home:0xcda48b,bakery:0xbd754d,repair:0x69899c,clinic:0xf3ede1,store:0xc4ad7b,terminal:0x376e99,hall:0xe8e0c8,jobs:0x8b9eae,school:0xcdb48b,business:0x6a95b8,bank:0x9c9ca9,farm:0xa36e48,mill:0xb1a394,market:0xe6bb74,warehouse:0x788c91};const b=box(width,tall,7,colors[type]||0xaabbcc);b.position.y=tall/2;g.add(b);const roof=box(width+.7,.4,7.7,type==='farm'?0x6b3325:0x364c60);roof.position.y=tall+.2;g.add(roof);for(let yy=2;yy<tall-1;yy+=2.5)for(let xx=-width/2+1.3;xx<width/2;xx+=2.3){const w=box(1.1,1.4,.08,0x8fd4e7);w.position.set(xx,yy,3.54);g.add(w)}const door=box(1.7,2.4,.15,0x283e49);door.position.set(0,1.2,3.6);g.add(door);const sign=label(name);sign.position.set(0,tall+2.1,0);g.add(sign);scene.add(g);buildings.push({name,type,x,z,mesh:g})}
function buildZone(){for(const obj of [...scene.children])if(obj.userData.world)scene.remove(obj);for(const b of buildings)scene.remove(b.mesh);buildings=[];const z=zones[state.zone];scene.background=new THREE.Color(z.sky);scene.fog.color.set(z.sky);const world=new THREE.Group();world.userData.world=true;scene.add(world);const floor=box(160,.15,160,z.ground);floor.position.y=-.12;world.add(floor);const road=box(11,.03,150,state.zone==='rural'?0xbda880:0x5c6670);road.position.y=.02;world.add(road);const cross=box(150,.03,9,state.zone==='rural'?0xbda880:0x5c6670);cross.position.y=.04;world.add(cross);if(state.zone!=='rural')for(let j=-65;j<=65;j+=8){const a=box(.2,.05,3,0xe7dfb1);a.position.set(0,.08,j);world.add(a);const b=box(3,.05,.2,0xe7dfb1);b.position.set(j,.08,0);world.add(b)}for(let i=0;i<28;i++){const x=((i*37)%130)-65,z=((i*61)%130)-65;if(Math.abs(x)<8||Math.abs(z)<8)continue;if(state.zone==='city'&&i%3===0){const tower=box(5,12+i%8,5,0x789cb7);tower.position.set(x,(12+i%8)/2,z);world.add(tower)}else{const t=new THREE.Group();t.position.set(x,0,z);const trunk=box(.45,2.5,.45,0x74533c);trunk.position.y=1.25;t.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.7,8,7),mat(state.zone==='rural'?0x467b36:0x458b58));crown.position.y=3.4;t.add(crown);world.add(t)}}z.objects.forEach((o,i)=>building(...o,i));player.position.set(0,0,8);$('zone').textContent=z.name;update();window.__OPPORTUNITY_READY__=true}
function applyEconomy(action,opts){const result=transact(state,action,opts);if(!result.ok){toast(result.reason);return false}state=result.state;update();return true}
function update(){$('stats').innerHTML='🪙 '+state.credits.toLocaleString()+' credits<br>⚡ '+state.energy+' energy · 🎓 Skill '+state.skill+'<br>📉 Loan '+state.debt.toLocaleString();$('zone').textContent=zones[state.zone].name;localStorage.setItem('opportunity-v2',JSON.stringify(state))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2600)}
function show(title,body){$('modalContent').innerHTML='<h2>'+title+'</h2>'+body;$('modal').classList.add('show')}
function close(){$('modal').classList.remove('show')}
function act(id){const b=buildings.find(x=>x.type===id);if(!b)return;interact(b)}
function interact(b){if(b.type==='terminal'){travel();return}if(b.type==='hall'){show('Town Hall · Career Counselling','<p>Public career counselling is free. Explore your interests, compare employment and self-study paths, or contribute to community projects.</p><div class="item">Career guidance: current skill '+state.skill+', student loan '+state.debt+' credits.</div><button id="advise">Get career advice</button> <button id="project">Contribute 50 credits to community transport</button>');$('advise').onclick=()=>show('Your Career Plan','<p>1. Seek entry-level work at the Employment Center.<br>2. Learn a new skill through University self-study.<br>3. Offer repair services for independent income.<br>4. Build savings before investing.</p><button id="ok">Continue</button>'),$('ok').onclick=close;$('project').onclick=()=>{if(applyEconomy('contribute')){toast('Community project funded!');close()}};return}
if(b.type==='jobs'||b.type==='bakery'){show('Employment · Bakery Assistant','<p>Salary: 180 credits per shift. Entry-level; no qualification required. Apply and work to build experience.</p><div class="item">Applications: '+state.applications+' · '+(state.employed?'Hired':'Not yet employed')+'</div><button id="apply">Apply for job</button> <button id="work">Work a shift</button>');$('apply').onclick=()=>{if(applyEconomy('apply')){toast('Application accepted! You are hired.');close()}};$('work').onclick=()=>{if(applyEconomy('shift')){toast('Shift complete: +180 credits');close()}};return}
if(b.type==='school'){show('University · Learning Marketplace','<p>Self-study through curated learning and practical assessment.</p><div class="item">Basic Repair Skills · Free self-study<br>Learn to inspect damage before selecting tools or materials.</div><button id="study">Study and take assessment</button>');$('study').onclick=()=>show('Practice Assessment','<p>A shoe has a detached sole. What should you do first?</p><button id="correct">Inspect materials and damage</button><br><br><button id="wrong">Apply adhesive immediately</button>'),setTimeout(()=>{$('correct').onclick=()=>{if(applyEconomy('study')){toast('Correct! Repair skill unlocked');close()}};$('wrong').onclick=()=>toast('Inspect the damage before choosing a repair method')},0);return}
if(b.type==='repair'){showQuest();return}
if(b.type==='home'){show('Your Apartment','<p>Rest restores energy. Housing costs 40 credits per rest.</p><button id="rest">Rest · 40 credits</button>');$('rest').onclick=()=>{if(applyEconomy('rest')){toast('Rested and recovered');close()}};return}
if(b.type==='farm'||b.type==='mill'||b.type==='market'||b.type==='warehouse'){show(b.name,'<p>Participate in the regional supply chain: farming, processing, storage and distribution.</p><button id="task">Complete local work · +75 credits</button>');$('task').onclick=()=>{if(applyEconomy('ruralWork')){toast('Work completed: +75 credits');close()}};return}
if(b.type==='bank'){show('Bank · Student Loan','<p>Outstanding education loan: '+state.debt+' credits.</p><button id="repay">Repay 100 credits</button>');$('repay').onclick=()=>{if(applyEconomy('repay')){toast('Loan payment recorded');close()}};return}
show(b.name,'<p>Public services and local commerce are expanding. Explore the other domains for jobs, training and opportunities.</p>')}
const questStorage='opportunity-quest-world-v1';
let quest=(()=>{try{const q=JSON.parse(localStorage.getItem(questStorage));return q?.id==='broken-shoes-v1'?q:initialQuest()}catch{return initialQuest()}})();
function questSave(){localStorage.setItem(questStorage,JSON.stringify(quest))}
function questStep(action,value){const r=transition(quest,action,value);if(r.ok){quest=r.state;questSave()}showQuest(r.message)}
function showQuest(message='A delivery worker needs their shoes repaired before tomorrow.'){
 const lines={discover:'A delivery worker needs help. Will you accept?',inspect:'Inspect the damage: the sole is peeling away and the upper is intact.',plan:'Choose a repair method. Adhesive bonds soles; stitches secure torn fabric.',prepare:'Select materials from the free starter kit.',repair:'Perform the repair operations in the correct sequence.',check:'Explain what holds your repair together.',resolve:'The customer tries the shoes. Deliver your work.',complete:'Repair delivered. Review the outcome and collect payment.'};
 const choices={discover:[['Accept repair quest','accept']],inspect:[['Sole separation','diagnose','sole'],['Torn upper','diagnose','upper']],plan:[['Adhesive bond','choose','adhesive'],['Stitching','choose','stitch']],prepare:[['Adhesive','collect','glue'],['Thread','collect','thread']],check:[['Adhesive bond','explain','bond'],['Stitched seam','explain','seam']],resolve:[['Deliver repair','finish']],complete:[]};
 const ops=quest.method==='adhesive'?['clean','apply','align','press']:['clean','align','stitch','inspect'];
 const buttons=quest.step==='repair'?ops.map(v=>[v[0].toUpperCase()+v.slice(1),'perform',v]):choices[quest.step];
 const reward=quest.step==='complete'&&!quest.paid?'<button id="questPayout">Collect earned repair payment</button>':quest.paid?'<p>Payment recorded. Referral unlocked for future quests.</p>':'';
 show('Quest 001 · The Broken Shoes','<p>'+lines[quest.step]+'</p><div class="item">Quality: '+quest.quality+' / 100 · Outcome: '+(quest.result||'pending')+'<p>'+message+'</p></div>'+buttons.map(([label,action,value],i)=>'<button data-quest="'+i+'">'+label+'</button>').join(' ')+reward+'<p class="sub">Progress is saved locally. Rewards use the prototype economy, not a multiplayer ledger.</p>');
 document.querySelectorAll('[data-quest]').forEach(b=>b.onclick=()=>{const [label,action,value]=buttons[Number(b.dataset.quest)];questStep(action,value)});
 const payout=$('questPayout');if(payout)payout.onclick=()=>{
   if(quest.paid)return showQuest('Already paid.');
   // The completed quest provides practical evidence, replacing the old one-click study shortcut.
   if(!state.learned){const skill=transact(state,'study',{key:'quest-001-competence'});if(!skill.ok)return showQuest(skill.reason);state=skill.state}
   const paid=transact(state,'repair',{key:'quest-001-payment'});
   if(!paid.ok){update();return showQuest(paid.reason)}
   state=paid.state;quest={...quest,paid:true,rewardClaimKey:'quest-001-payment',events:[...quest.events,'reward-claimed']};
   questSave();update();showQuest('Repair payment: +90 credits. Recorded once.');
 };
}
function travel(){show('Regional Transport','<p>Choose a destination. Travel fares are deducted from your wallet.</p>'+Object.entries(zones).map(([id,z])=>'<div class="item row"><span>'+z.name+'</span><button data-zone="'+id+'">'+(id===state.zone?'Current':id==='rural'?'35 credits':'15 credits')+'</button></div>').join(''));document.querySelectorAll('[data-zone]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.zone;if(id===state.zone)return close();if(applyEconomy('travel',{zone:id})){buildZone();close();toast('Arrived at '+zones[id].name)}})}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dz=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if(!$('modal').classList.contains('show')&&(dx||dz)){const len=Math.hypot(dx,dz);player.position.x=THREE.MathUtils.clamp(player.position.x+dx/len*dt*8,-74,74);player.position.z=THREE.MathUtils.clamp(player.position.z+dz/len*dt*8,-74,74);player.rotation.y=Math.atan2(dx,dz)}const target=player.position.clone().add(new THREE.Vector3(0,1.7,0));camera.position.set(target.x+zoom*Math.sin(yaw)*Math.cos(pitch),target.y+zoom*Math.sin(pitch),target.z+zoom*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(target);const nearest=buildings.map(b=>({...b,d:Math.hypot(player.position.x-b.x,player.position.z-b.z)})).sort((a,b)=>a.d-b.d)[0];$('hint').innerHTML=nearest&&nearest.d<9?'Press <span class="key">E</span> · '+nearest.name:'WASD move · E interact · Drag to orbit';window.nearest=nearest&&nearest.d<9?nearest:null;renderer.render(scene,camera);mini()}
function mini(){const cv=$('minimap'),c=cv.getContext('2d');c.clearRect(0,0,160,115);c.fillStyle='#294b59';c.fillRect(0,0,160,115);c.strokeStyle='#9da4a0';c.lineWidth=8;c.beginPath();c.moveTo(80,0);c.lineTo(80,115);c.moveTo(0,58);c.lineTo(160,58);c.stroke();for(const b of buildings){c.fillStyle='#a4d5ee';c.fillRect(80+b.x*.95-3,58+b.z*.7-3,6,6)}c.fillStyle='#ffda67';c.beginPath();c.arc(80+player.position.x*.95,58+player.position.z*.7,4,0,Math.PI*2);c.fill()}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e'&&window.nearest&&!$('modal').classList.contains('show'))interact(window.nearest)});window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});window.addEventListener('pointerdown',e=>{if(e.target.tagName==='CANVAS'&&e.target.id!=='minimap'){drag=true;lastX=e.clientX;lastY=e.clientY}});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-lastX)*.006;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lastY)*.004,.12,1.25);lastX=e.clientX;lastY=e.clientY}});window.addEventListener('wheel',e=>zoom=THREE.MathUtils.clamp(zoom+e.deltaY*.01,7,34),{passive:true});
$('closeBtn').onclick=close;$('mapBtn').onclick=travel;$('careerBtn').onclick=()=>{if(state.zone==='city'){interact({type:'hall',name:'Town Hall'});return}show('Career Services','<p>Free career counselling is available at Town Hall in the Big City. Travel fare applies.</p><button id="goCity">Travel to Big City · 15 credits</button>');$('goCity').onclick=()=>{if(applyEconomy('travel',{zone:'city'})){buildZone();close()}}};$('profileBtn').onclick=()=>show('Citizen Profile','<p>Degree: '+state.education+'<br>Credits: '+state.credits+'<br>Student debt: '+state.debt+'<br>Skill level: '+state.skill+'<br>Employed: '+(state.employed?'Yes':'No')+'<br>Repair jobs: '+state.repairs+'<br>Community contributions: '+state.contributed+'</p><button id="reset">Reset character</button>'),$('reset').onclick=()=>{if(confirm('Reset all saved progress?')){localStorage.removeItem('opportunity-v2');location.reload()}};$('saveBtn').onclick=()=>{update();toast('Progress saved locally')};window.addEventListener('error',e=>{const msg='Game error: '+e.message;console.error(msg);toast(msg)});init();
</script></body></html>
